name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No se conecta a una base de datos real: todas las páginas son dinámicas
# (force-dynamic / server actions), así que build/generate no necesitan
# datos reales, sólo que las variables de entorno estén definidas.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-only-secret-not-used-in-production"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc --noEmit necesita los tipos ambientes de rutas/layouts que Next.js
      # genera en .next/types (ej. LayoutProps) — normalmente aparecen recién
      # al correr dev/build, así que en un checkout limpio hay que generarlos
      # antes, sin pagar el costo de un build completo.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
